<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<title>Share image source</title>
<!-- Source for assets/img/og.png (1200 × 630). Render: node tools/render-og.js -->
<style>
  @font-face { font-family: "Cinzel"; src: url("../assets/fonts/cinzel.woff2") format("woff2"); font-weight: 400 700; }
  @font-face { font-family: "Cormorant Garamond"; src: url("../assets/fonts/cormorant-italic.woff2") format("woff2"); font-style: italic; }
  @font-face { font-family: "DM Sans"; src: url("../assets/fonts/dmsans.woff2") format("woff2"); font-weight: 400 700; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #16001f; }
  .card { position: relative; width: 1200px; height: 630px; color: #f8f5ef; font-family: "DM Sans", sans-serif; }
  .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 60% 55%; }
  .veil { position: absolute; inset: 0; background: linear-gradient(90deg, rgb(22 0 31 / .92), rgb(22 0 31 / .55) 45%, rgb(22 0 31 / 0) 75%), linear-gradient(0deg, rgb(22 0 31 / .8), transparent 35%); }
  .content { position: absolute; left: 72px; top: 70px; right: 420px; }
  .mark { width: 96px; filter: drop-shadow(0 0 24px rgb(142 63 255 / .6)); }
  h1 { margin: 26px 0 0; font: 500 76px/0.98 "Cinzel", serif; }
  .church { display: flex; align-items: center; gap: 16px; margin-top: 14px; font: 500 22px/1 "Cinzel", serif; letter-spacing: .42em; color: #e5c76b; }
  .church::before { content: ""; width: 48px; height: 1px; background: #c9a227; }
  .lede { margin-top: 28px; font: italic 500 34px/1.2 "Cormorant Garamond", serif; }
  .foot { position: absolute; left: 72px; right: 72px; bottom: 44px; display: flex; justify-content: space-between; font: 600 15px/1 "DM Sans", sans-serif; letter-spacing: .2em; text-transform: uppercase; color: #d9c9ea; }
  .foot b { color: #e5c76b; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <img class="bg" src="../assets/img/scenes/hero-1600.webp" alt="">
    <div class="veil"></div>
    <div class="content">
      <img class="mark" src="../assets/img/emblem-240.webp" alt="">
      <h1>The Father’s House</h1>
      <p class="church">All Nations Church</p>
      <p class="lede">A praying family, standing for the healing of the land.</p>
    </div>
    <div class="foot"><span>Sunday <b>9:00 AM</b> · Friday Night Prayer <b>7:00 PM</b></span><span>Port Moresby · PNG</span></div>
  </div>
</body>
</html>
