<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="The Father's House All Nations Church emblem — an eagle rising through the door of the house">
  <defs>
    <linearGradient id="tfh-wing" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5b21b6"/>
      <stop offset=".6" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="tfh-wing-l" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#5b21b6"/>
      <stop offset=".6" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <!-- the door of the house -->
  <path d="M36 112 V62 A24 24 0 0 1 84 62 V112" fill="none" stroke="#c9a24b" stroke-width="3" stroke-linecap="round"/>
  <!-- right wing: outer crescent + inner light crescent -->
  <path d="M60 66 C 84 64 104 50 116 28 C 114 60 90 76 60 76 Z" fill="url(#tfh-wing)"/>
  <path d="M64 55 C 80 51 92 41 100 25 C 100 47 85 59 64 63 Z" fill="#c4b5fd"/>
  <!-- left wing -->
  <g transform="matrix(-1 0 0 1 120 0)">
    <path d="M60 66 C 84 64 104 50 116 28 C 114 60 90 76 60 76 Z" fill="url(#tfh-wing-l)"/>
    <path d="M64 55 C 80 51 92 41 100 25 C 100 47 85 59 64 63 Z" fill="#c4b5fd"/>
  </g>
  <g fill="url(#tfh-wing)">
    <!-- head and beak -->
    <circle cx="60" cy="40" r="7"/>
    <path d="M66 36.5 L76 40.5 L66 44.5 Z"/>
    <!-- body -->
    <path d="M54.5 52 C 52.5 70 55 84 60 94 C 65 84 67.5 70 65.5 52 C 63.5 55.5 56.5 55.5 54.5 52 Z"/>
    <!-- tail fan -->
    <path d="M56 80 L50 98 L60 90 L70 98 L64 80 Z"/>
  </g>
</svg>
